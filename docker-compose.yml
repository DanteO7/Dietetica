services:
  postgres:
    image: postgres:17-alpine
    container_name: dietetica-postgres

    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - proxy-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dietetica -d dietetica"]
      interval: 30s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    container_name: dietetica-backend

    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      - postgres

    networks:
      - proxy-network

    expose:
      - "8080"

    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8080/api/auth/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    container_name: dietetica-frontend

    build:
      context: ./frontend
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      - backend

    networks:
      - proxy-network

    expose:
      - "80"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres-data:

networks:
  proxy-network:
    external: true
